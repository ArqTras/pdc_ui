        <script type="text/javascript">
            (function () {
                function patch(method) {
                    var orig = history[method];
                    history[method] = function (state, title, url) {
                        try {
                            return orig.apply(this, arguments);
                        } catch (e) {
                            try {
                                return orig.call(this, state, title);
                            } catch (e2) {
                                return undefined;
                            }
                        }
                    };
                }
                patch('pushState');
                patch('replaceState');
            })();
        </script>
